<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti, mi amor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fdf2f8; 
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* --- Reproductor de Vinilo --- */
        #vinyl-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #222;
            border-radius: 50%;
            border: 2px solid #e83e8c;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
        }
        #vinyl-player::after {
            content: '';
            width: 15px;
            height: 15px;
            background: #e83e8c;
            border-radius: 50%;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .carousel-item img {
            border-radius: 15px;
            max-height: 50vh;
            object-fit: cover;
        }
        .btn-sorpresa {
            background-color: #e83e8c;
            color: white;
            border-radius: 30px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 6px rgba(232, 62, 140, 0.3);
            transition: transform 0.2s;
        }
        .btn-sorpresa:active { transform: scale(0.95); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        #seccion-carta {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fdf2f8;
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .env-wrapper {
            position: relative;
            width: 280px;
            height: 180px;
            margin-top: 100px;
            cursor: pointer;
        }
        .env-back {
            position: absolute;
            width: 100%; height: 100%;
            background: #d81b60;
            border-radius: 8px;
            z-index: 1;
        }
        .env-letter {
            position: absolute;
            top: 10px; left: 10px;
            width: 260px; height: 160px;
            background: #fff;
            z-index: 2;
            border-radius: 5px;
            transition: all 0.8s ease-in-out;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #333;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        /* Frente del sobre (Solapas laterales y abajo) */
        .env-front {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 3;
            border-left: 140px solid #e91e63;
            border-right: 140px solid #e91e63;
            border-bottom: 90px solid #c2185b;
            border-top: 90px solid transparent;
            border-radius: 8px;
        }
        .env-flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            z-index: 4;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #f06292;
            transform-origin: top;
            transition: transform 0.6s ease;
        }

        .env-wrapper.open .env-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .env-wrapper.open .env-letter {
            transform: translateY(-160px);
            height: 320px;
            z-index: 5;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <audio id="musica-fondo" loop>
        <source src="tu-cancion.mp3" type="audio/mpeg">
    </audio>

    <div id="vinyl-player" onclick="toggleMusic()"></div>

    <div class="container hero-section text-center">
        <h1 class="display-4 fw-bold text-dark mb-3">¡Felices 2 Años HERMOSAAAA💗💗💗!</h1>
        <p class="text-muted mb-4">Dos años de momentos preciosos junto con la mejor novia del mundo mundial💗💗</p>

        <div id="carruselAmor" class="carousel slide shadow-lg rounded-4 mb-5" data-bs-ride="carousel" style="width: 100%; max-width: 400px;">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="Foto-1.jpeg" class="d-block w-100" alt="Nosotros en el centro">
                </div>
                <div class="carousel-item">
                    <img src="Foto-2.jpeg" class="d-block w-100" alt="Viaje">
                </div>
                <div class="carousel-item">
                    <img src="Foto-3.jpeg" class="d-block w-100" alt="Viaje">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carruselAmor" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselAmor" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <button type="button" class="btn btn-sorpresa" data-bs-toggle="modal" data-bs-target="#modalMensaje">
            Toca aquí ✨
        </button>
    </div>

    <div class="modal fade" id="modalMensaje" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4 border-0 rounded-4 shadow">
                <div class="modal-body py-5">
                    <h2 class="fw-bold mb-4" style="color: #e83e8c;">¿Me ama mucho bebe? 💍</h2>
                    
                    <div class="d-flex justify-content-center gap-3 mt-4" id="botones-propuesta">
                        <button id="btn-si" class="btn btn-success btn-lg px-4 rounded-pill fs-4 shadow">¡Sí!</button>
                        <button id="btn-no" class="btn btn-danger btn-lg px-4 rounded-pill fs-4 shadow">No</button>
                    </div>
                    
                    <div id="mensaje-final" class="mt-4 d-none">
                        <h3 class="text-success fw-bold">Sabía que ibas a decir que si pechocha ❤️</h3>
                        <button id="btn-carta" class="btn btn-sorpresa mt-4 fade-in">Una carta para ti 💌</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="seccion-carta">
        <h3 class="text-muted mb-4 text-center px-3" id="instruccion-sobre">Toca el sobre para abrirlo...</h3>
        
        <div class="env-wrapper" id="sobre">
            <div class="env-back"></div>
            <div class="env-flap"></div>
            <div class="env-front"></div>
            <div class="env-letter" id="texto-carta"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        const audio = document.getElementById('musica-fondo');
        const vinyl = document.getElementById('vinyl-player');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                vinyl.style.animationPlayState = 'paused';
            } else {
                audio.play();
                vinyl.style.animationPlayState = 'running';
            }
            isPlaying = !isPlaying;
        }

        const btnSi = document.getElementById('btn-si');
        const btnNo = document.getElementById('btn-no');
        const mensajeFinal = document.getElementById('mensaje-final');
        const contenedorBotones = document.getElementById('botones-propuesta');

        btnNo.addEventListener('click', function() {
            btnNo.classList.add('shake-anim');
            setTimeout(() => {
                btnNo.classList.remove('shake-anim', 'btn-danger');
                btnNo.classList.add('btn-success');
                btnNo.innerText = '¡Sí!';
                btnNo.addEventListener('click', celebrar);
            }, 400);
        });

        btnSi.addEventListener('click', celebrar);

        function celebrar() {
            contenedorBotones.classList.add('d-none');
            mensajeFinal.classList.remove('d-none');
            
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#e83e8c', '#ff0000', '#ffffff'] });
        }

        const btnCarta = document.getElementById('btn-carta');
        const seccionCarta = document.getElementById('seccion-carta');
        const modalEl = document.getElementById('modalMensaje');
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        
        const sobre = document.getElementById('sobre');
        const textoCarta = document.getElementById('texto-carta');
        const instruccion = document.getElementById('instruccion-sobre');

        const mensajeDeAmor = "Hola mi amor,\n\nQuería intentar hacer algo especial para estos dos años. Sos la persona más increíble del mundo y cada día a tu lado es una aventura hermosa. Gracias por bancarme siempre y por estar ahi para mi.\n\nTe amo con todo mi corazón ❤️.\n\nNo me alcanzan las palabras para decirte lo mucho que significas para mi. Espero que este pequeño detalle te haga sonreír tanto como vos me haces sonreír\n\nfelicidades por los 2 años preciosa❤️❤️❤️\n\nCon todo mi amor,\nTu Bebé";

        let i = 0;

        btnCarta.addEventListener('click', () => {
            modal.hide(); // Cierra el modal de Bootstrap
            seccionCarta.style.display = 'flex'; 
            
            if(!isPlaying) toggleMusic(); 
        });

        sobre.addEventListener('click', () => {
            if(!sobre.classList.contains('open')) {
                sobre.classList.add('open');
                instruccion.style.opacity = '0';
                
                setTimeout(escribirCarta, 800);
            }
        });

        function escribirCarta() {
            if (i < mensajeDeAmor.length) {
             
                if (mensajeDeAmor.charAt(i) === '\n') {
                    textoCarta.innerHTML += '<br>';
                } else {
                    textoCarta.innerHTML += mensajeDeAmor.charAt(i);
                }
                i++;
                setTimeout(escribirCarta, 50);
            }
        }
    </script>
</body>
</html>
